name: ArtistDeck Smart Links isolated database tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artistdeck-smart-links-isolated-db-tests
  cancel-in-progress: false

jobs:
  test:
    name: Run disposable Supabase behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SMART_LINKS_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install local PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Start and bootstrap disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          test_workdir="$RUNNER_TEMP/artistdeck-smart-links-supabase"
          mkdir -p "$test_workdir"
          supabase --workdir "$test_workdir" init
          supabase --workdir "$test_workdir" start
          psql "$SMART_LINKS_LOCAL_DATABASE_URL" --set=ON_ERROR_STOP=1 --file supabase/tests/smart-links-bootstrap.sql
          psql "$SMART_LINKS_LOCAL_DATABASE_URL" --set=ON_ERROR_STOP=1 --file supabase/migrations/20261119160000_create_smart_links_foundation.sql
          psql "$SMART_LINKS_LOCAL_DATABASE_URL" --set=ON_ERROR_STOP=1 --file supabase/migrations/20261120145900_smart_links_management_rpc.sql

      - name: Run Phase 1A and 1B PostgreSQL behavior suites
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:smart-links-phase1a:db
          pnpm run test:smart-links-phase1b:db

      - name: Stop disposable local Supabase
        if: always()
        run: supabase --workdir "$RUNNER_TEMP/artistdeck-smart-links-supabase" stop --no-backup || true
